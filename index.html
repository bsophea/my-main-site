<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComingSoon.10000 Company</title>
<meta name="description" content="Our new website is under construction. Welcome, see what we do, and get in touch.">
<style>
  /* ====== EDIT HERE ======
     Swap --bg-image with your own photo, e.g. url("images/hero.jpg")
     or a remote URL. The default is a built-in abstract image. */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --bg-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' preserveAspectRatio='xMidYMid slice'><defs><radialGradient id='a' cx='20%25' cy='25%25' r='60%25'><stop offset='0' stop-color='%232a6f97'/><stop offset='1' stop-color='%232a6f97' stop-opacity='0'/></radialGradient><radialGradient id='b' cx='85%25' cy='80%25' r='55%25'><stop offset='0' stop-color='%23c9784a'/><stop offset='1' stop-color='%23c9784a' stop-opacity='0'/></radialGradient></defs><rect width='1600' height='900' fill='%230e1a24'/><rect width='1600' height='900' fill='url(%23a)'/><rect width='1600' height='900' fill='url(%23b)'/></svg>");
    --overlay: rgba(8, 14, 20, .55);
    --text: #f4f6f8;
    --muted: rgba(244, 246, 248, .72);
    --line: rgba(244, 246, 248, .22);
    --accent: #f2b27d;
    --progress: 69%;
    --pad-top: env(safe-area-inset-top, 0px);
    --pad-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: #0e1a24 var(--bg-image) center / cover no-repeat fixed;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; background: var(--overlay); z-index: -1;
  }

  .page {
    min-height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(2rem + var(--pad-top)) clamp(1.5rem, 6vw, 5rem) calc(2rem + var(--pad-bottom));
    max-width: 1200px; margin: 0 auto;
  }

  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .brand {
    font-family: var(--font);
    font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em;
  }
  .status {
    display: inline-flex; align-items: center; gap: .55rem;
    border: 1px solid var(--line); border-radius: 999px;
    padding: .35rem .9rem; font-size: .875rem; color: var(--muted);
    backdrop-filter: blur(6px); background: rgba(255,255,255,.05);
  }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  main { padding: 3rem 0; max-width: 40rem; }
  h1 {
    font-family: var(--font);
    font-weight: 600; font-size: clamp(2.6rem, 7vw, 4.75rem);
    line-height: 1.05; letter-spacing: -.025em; margin: 0 0 1.25rem;
  }
  .lead { font-size: 1.15rem; color: var(--muted); margin: 0 0 2rem; max-width: 34rem; }

  .progress { max-width: 22rem; margin-top: 2rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: .875rem; color: var(--muted); margin-bottom: .5rem; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: var(--progress); background: var(--accent); border-radius: 4px; }


  .countdown { display: flex; gap: clamp(1rem, 4vw, 2.5rem); margin-top: .5rem; }
  .unit { min-width: 4.2rem; }
  .unit b {
    display: block; font-weight: 600; font-size: clamp(2.25rem, 6vw, 3.5rem);
    line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  }
  .unit span { display: block; margin-top: .5rem; font-size: .8125rem; color: var(--muted); letter-spacing: .02em; }
  .launch-note { margin: 0 0 1.25rem; font-size: .875rem; color: var(--muted); }

  .info {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 2rem 4rem;
    border-top: 1px solid var(--line); padding-top: 1.75rem;
  }
  h2 { font-family: var(--font); font-size: 1rem; font-weight: 500; margin: 0 0 .75rem; color: var(--accent); }
  .services { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .9rem 1.5rem; }
  .services strong { display: block; font-weight: 600; }
  .services small { color: var(--muted); font-size: .9rem; }
  address { font-style: normal; display: grid; gap: .3rem; }
  a { color: var(--text); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; transition: text-decoration-color .2s; }
  a:hover { text-decoration-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

  footer { margin-top: 1.5rem; font-size: .8125rem; color: var(--muted); }

  @media (max-width: 760px) {
    .info { grid-template-columns: 1fr; gap: 1.75rem; }
    main { padding: 2.5rem 0 2rem; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="status"><span class="dot" aria-hidden="true"></span>Website under construction</div>
    </header>

    <main>
      <h1>Welcome. Something will be gone on the way.</h1>
      <p class="lead">We’re in the middle of nowhere. Until it’s ready, you can find out more later.</p>
      <p class="launch-note">Hosting plan expires on <span id="launch-label"></span></p>
      <div class="countdown" id="countdown" role="timer" aria-label="Time until launch">
        <div class="unit"><b id="cd-d">00</b><span>Days</span></div>
        <div class="unit"><b id="cd-h">00</b><span>Hours</span></div>
        <div class="unit"><b id="cd-m">00</b><span>Minutes</span></div>
        <div class="unit"><b id="cd-s">00</b><span>Seconds</span></div>
      </div>
    </main>

  </div>
  <script>
  // ====== SET YOUR LAUNCH DATE HERE (local time) ======
  const LAUNCH = new Date("2026-11-20T09:00:00");

  const pad = n => String(n).padStart(2, "0");
  const el = id => document.getElementById(id);
  el("launch-label").textContent = LAUNCH.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

  function tick() {
    const diff = Math.max(0, LAUNCH - new Date());
    el("cd-d").textContent = pad(Math.floor(diff / 864e5));
    el("cd-h").textContent = pad(Math.floor(diff / 36e5) % 24);
    el("cd-m").textContent = pad(Math.floor(diff / 6e4) % 60);
    el("cd-s").textContent = pad(Math.floor(diff / 1e3) % 60);
  }
  tick();
  setInterval(tick, 1000);
  document.getElementById("y").textContent = new Date().getFullYear();
</script>
</body>
</html>
